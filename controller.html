<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>รีโมทนำเสนอ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #000;
            --panel: rgba(255, 255, 255, .06);
            --line: rgba(255, 255, 255, .10);
            --text: #f5f5f7;
            --muted: #86868b;
            --dim: #5a5a5e;
            --gold: #e8b44c;
            --leaf: #74d68a;
            --ease: cubic-bezier(.22, .61, .36, 1);
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans Thai', 'Inter', -apple-system, BlinkMacSystemFont,
                'Segoe UI', 'Leelawadee UI', Tahoma, sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
            padding: calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px);
            gap: 10px;
            user-select: none;
        }

        .num {
            font-family: 'Inter', sans-serif;
            font-variant-numeric: tabular-nums;
        }

        /* ── status ── */
        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
            position: relative;
            z-index: 5;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
        }

        .led {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--dim);
            transition: background .3s, box-shadow .3s;
        }

        .led.on {
            background: var(--leaf);
            box-shadow: 0 0 10px rgba(116, 214, 138, .8);
        }

        .pill-btn {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--muted);
            font-family: inherit;
            font-size: 11px;
            font-weight: 500;
            padding: 7px 13px;
            border-radius: 999px;
            cursor: pointer;
        }

        /* ── current slide ── */
        .now {
            flex-shrink: 0;
            display: flex;
            align-items: baseline;
            gap: 10px;
            position: relative;
            z-index: 2;
        }

        .now .idx {
            font-size: 13px;
            font-weight: 700;
            color: var(--gold);
            flex-shrink: 0;
        }

        .now .title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -.02em;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── cue: what to DO ── */
        .cue {
            flex-shrink: 0;
            display: flex;
            gap: 9px;
            padding: 10px 13px;
            border-radius: 13px;
            background: rgba(232, 180, 76, .10);
            border: 1px solid rgba(232, 180, 76, .22);
            font-size: 13px;
            font-weight: 500;
            line-height: 1.5;
            color: #f0cd85;
            position: relative;
            z-index: 2;
        }

        .cue::before {
            content: '▸';
            flex-shrink: 0;
        }

        .cue[hidden] {
            display: none;
        }

        /* ── script: what to SAY ── */
        .script {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 2px 2px 4px;
            position: relative;
            z-index: 2;
        }

        .script p {
            font-size: 19px;
            font-weight: 400;
            line-height: 1.85;
            color: #e8e8ed;
            text-wrap: pretty;
        }

        /* ── next up: the thing you glance at ── */
        .next-card {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 15px;
            border-radius: 16px;
            background: linear-gradient(120deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));
            border: 1px solid var(--line);
            position: relative;
            z-index: 2;
        }

        .next-card .tag {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            color: var(--dim);
            flex-shrink: 0;
        }

        .next-card .nx {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -.01em;
            line-height: 1.25;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .next-card .arrow {
            margin-left: auto;
            font-size: 17px;
            color: var(--gold);
            flex-shrink: 0;
        }

        /* ── jump grid ── */
        .grid {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            position: relative;
            z-index: 5;
        }

        .grid button {
            height: 34px;
            border-radius: 9px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--muted);
            font-family: 'Inter', sans-serif;
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s var(--ease), color .2s var(--ease);
        }

        .grid button.on {
            background: var(--gold);
            border-color: var(--gold);
            color: #1d1d1f;
        }

        /* ── tap hint ── */
        .hint {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--dim);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .hint span {
            padding: 9px 0;
            border-radius: 11px;
            border: 1px dashed rgba(255, 255, 255, .13);
        }

        .hint .r {
            color: rgba(232, 180, 76, .75);
            border-color: rgba(232, 180, 76, .3);
        }

        /* tap feedback flash */
        .flash {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 42%;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s var(--ease);
        }

        .flash.l {
            left: 0;
            background: linear-gradient(90deg, rgba(255, 255, 255, .16), transparent);
        }

        .flash.r {
            right: 0;
            background: linear-gradient(270deg, rgba(232, 180, 76, .22), transparent);
        }

        .flash.go {
            opacity: 1;
            transition-duration: 0s;
        }

        /* ── pairing sheet ── */
        .sheet {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, .78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .sheet[hidden] {
            display: none;
        }

        .sheet-card {
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--line);
            border-radius: 26px;
            background: #1c1c1e;
            padding: 26px 22px;
            text-align: center;
        }

        .sheet-card h3 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -.02em;
        }

        .sheet-card p {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.65;
            color: var(--muted);
        }

        .sheet-card input {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .06);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: .22em;
            text-align: center;
            text-transform: uppercase;
        }

        .sheet-card input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .sheet-card .go {
            width: 100%;
            margin-top: 12px;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: var(--gold);
            color: #1d1d1f;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .sheet-card .close {
            margin-top: 14px;
            background: none;
            border: none;
            color: var(--muted);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        @media (max-height: 700px) {
            .script p {
                font-size: 16px;
                line-height: 1.7;
            }

            .now .title {
                font-size: 17px;
            }

            .next-card .nx {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="flash l" id="flashL"></div>
    <div class="flash r" id="flashR"></div>

    <div class="bar">
        <div class="status"><span class="led" id="led"></span><span id="statusText">กำลังเชื่อมต่อ…</span></div>
        <button class="pill-btn" id="pairBtn">โหมดอินเทอร์เน็ต</button>
    </div>

    <div class="now">
        <div class="idx num" id="idx">1/10</div>
        <div class="title" id="title">—</div>
    </div>

    <div class="cue" id="cue"></div>

    <div class="script" id="scriptWrap">
        <p id="script">—</p>
    </div>

    <div class="next-card">
        <div class="tag">ถัดไป</div>
        <div class="nx" id="nextTitle">—</div>
        <div class="arrow">›</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="hint">
        <span>‹ แตะซ้าย · ย้อน</span>
        <span class="r">แตะขวา · ถัดไป ›</span>
    </div>

    <div class="sheet" id="sheet" hidden>
        <div class="sheet-card">
            <h3>เชื่อมผ่านอินเทอร์เน็ต</h3>
            <p>ใส่รหัสห้องที่แสดงบนจอนำเสนอ</p>
            <input id="roomInput" maxlength="6" placeholder="ABC123" autocomplete="off" autocapitalize="characters"
                spellcheck="false">
            <button class="go" id="joinBtn">เชื่อมต่อ</button>
            <button class="close" id="closeSheet">ปิด</button>
        </div>
    </div>

    <script src="deck-data.js"></script>
    <script src="sync.js"></script>
    <script>
        const SLIDES = window.DECK_SLIDES;
        const total = SLIDES.length;
        let cur = 0;

        const $ = id => document.getElementById(id);

        SLIDES.forEach((s, i) => {
            const b = document.createElement('button');
            b.textContent = s.n;
            b.addEventListener('click', () => go(i));
            $('grid').appendChild(b);
        });
        const cells = $('grid').querySelectorAll('button');

        function render() {
            const s = SLIDES[cur];
            $('idx').textContent = (cur + 1) + '/' + total;
            $('title').textContent = s.title;
            $('script').textContent = s.script;
            $('cue').hidden = !s.cue;
            if (s.cue) $('cue').textContent = s.cue;
            $('nextTitle').textContent = cur + 1 < total ? SLIDES[cur + 1].title : 'จบการนำเสนอ';
            cells.forEach((c, i) => c.classList.toggle('on', i === cur));
            $('scriptWrap').scrollTop = 0;
        }

        const sync = DeckSync.create({
            role: 'ctrl',
            onMessage(msg) {
                if (typeof msg.slide === 'number' && msg.slide !== cur) {
                    cur = Math.max(0, Math.min(total - 1, msg.slide));
                    render();
                }
            },
            onStatus(st) {
                $('led').classList.toggle('on', st.lan || st.cloud);
                $('statusText').textContent = st.lan ? 'เชื่อมแล้ว · Wi-Fi'
                    : st.cloud ? 'เชื่อมแล้ว · อินเทอร์เน็ต'
                        : st.cloudPending ? 'กำลังเชื่อมต่อ…'
                            : 'ยังไม่ได้เชื่อม';
                if (st.room) $('pairBtn').textContent = 'ห้อง ' + st.room;
            }
        });

        function go(n) {
            if (n < 0 || n >= total || n === cur) return;
            cur = n;
            render();
            if (navigator.vibrate) navigator.vibrate(10);
            sync.send({ type: 'goto', slide: cur });
        }

        function flash(left) {
            const el = left ? $('flashL') : $('flashR');
            el.classList.add('go');
            setTimeout(() => el.classList.remove('go'), 60);
        }

        // ── tap anywhere: right half advances, left half goes back ──
        // a tap that scrolls or lands on a control is ignored, so the
        // script can still be scrolled and the grid still works.
        const INTERACTIVE = 'button, input, a, .sheet, .grid';
        let sx = 0, sy = 0, moved = false;

        document.addEventListener('touchstart', e => {
            const t = e.touches[0];
            sx = t.clientX; sy = t.clientY; moved = false;
        }, { passive: true });

        document.addEventListener('touchmove', e => {
            const t = e.touches[0];
            if (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) moved = true;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (moved) return;
            if (e.target.closest && e.target.closest(INTERACTIVE)) return;
            const left = e.changedTouches[0].clientX < window.innerWidth * 0.38;
            flash(left);
            go(cur + (left ? -1 : 1));
        });

        // desktop / testing
        document.addEventListener('click', e => {
            if (e.pointerType === '' || !('ontouchstart' in window)) {
                if (e.target.closest && e.target.closest(INTERACTIVE)) return;
                const left = e.clientX < window.innerWidth * 0.38;
                flash(left);
                go(cur + (left ? -1 : 1));
            }
        });

        // ── cloud pairing ──
        $('pairBtn').addEventListener('click', () => $('sheet').hidden = false);
        $('closeSheet').addEventListener('click', () => $('sheet').hidden = true);
        $('joinBtn').addEventListener('click', () => {
            const code = $('roomInput').value.trim().toUpperCase();
            if (code.length < 4) { $('roomInput').focus(); return; }
            $('sheet').hidden = true;
            $('statusText').textContent = 'กำลังเชื่อมต่อ…';
            sync.enableCloud(code)
                .then(() => sync.send({ type: 'hello' }))
                .catch(() => { $('statusText').textContent = 'เชื่อมไม่สำเร็จ'; });
        });

        // room code arrives in the QR link: controller.html?room=ABC123
        const urlRoom = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
        if (urlRoom) {
            $('roomInput').value = urlRoom;
            $('pairBtn').textContent = 'ห้อง ' + urlRoom;
            setTimeout(() => {
                if (!sync.status.lan) {
                    sync.enableCloud(urlRoom)
                        .then(() => sync.send({ type: 'hello' }))
                        .catch(() => { $('statusText').textContent = 'เชื่อมไม่สำเร็จ'; });
                }
            }, 1000);
        }

        render();
        setTimeout(() => sync.send({ type: 'hello' }), 700);
    </script>
</body>

</html>
